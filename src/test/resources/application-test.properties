# Test-profile overlay. A profile-specific file LAYERS over the main application.properties
# rather than shadowing it (a plain src/test/resources/application.properties would replace
# the main file entirely, since Spring takes the first application.properties on the classpath
# and Gradle puts test resources first).
#
# Tests run several @SpringBootTest contexts in one JVM, and Hibernate Search derives its
# Lucene index directory from the entity name - so every context builds an IndexWriter for the
# same index path and contends for the same write.lock. Relocating directory.root only moves
# the collision; local-heap removes it, because an in-memory directory takes no file lock.
# Production keeps the filesystem backend from the main application.properties.
spring.jpa.properties.hibernate.search.backend.directory.type=local-heap
