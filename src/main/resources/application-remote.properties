# Runs the second-level cache against an external Infinispan server over Hot Rod instead of the
# embedded default. Activate with SPRING_PROFILES_ACTIVE=remote (or --spring.profiles.active=remote);
# combines with the prod profile, e.g. SPRING_PROFILES_ACTIVE=prod,remote.
#
# Connection details live in hotrod-client.properties, which reads INFINISPAN_HOSTS, INFINISPAN_USER
# and INFINISPAN_PASSWORD from the environment.
#
# Tenant scoping is unchanged by this profile: TenantAwareJCacheRegionFactory works against the
# JCache CacheManager, so the per-tenant region split applies identically to a remote cache.
#
# Marshalling is configured in hotrod-client.properties (Java serialization plus an explicit
# deserialization allowlist). Two things about it are easy to get wrong, both learned the hard way:
#
#   - It is Hibernate's own cache classes that cross the wire, not the entities. The key is
#     org.hibernate.cache.internal.CacheKeyImplementation - which is what carries the tenant - and
#     the value is a cache entry of disassembled field values. Annotating Note for Protostream
#     would not have helped.
#
#   - The allowlist must cover the JDBC types Hibernate disassembles fields into, not just the
#     types the entity declares. Note.createdDate is a java.util.Date but is cached as a
#     java.sql.Timestamp, and a missing entry fails only on READ (HTTP 500), not at startup.
#
# Verified end to end against Infinispan Server 16.2.3: reads served from the remote cache with no
# SQL, and tenant_a/tenant_b entries confirmed in separate server-side caches.
notes.cache.mode=remote
