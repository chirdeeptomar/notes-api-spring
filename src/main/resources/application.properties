spring.application.name=notes-api-spring

# Serve on 8081 rather than the default 8080. Tests are unaffected (they bind a random port).
server.port=8081

# Database (dev/test): H2 in PostgreSQL compatibility mode, matching the source project.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Elide endpoint paths - must match the Quarkus app exactly.
elide.json-api.enabled=true
elide.json-api.path=/api/v1
elide.graphql.enabled=true
elide.graphql.path=/graphql/api/v1
elide.api-docs.enabled=true
elide.api-docs.path=/api-docs

# Metrics. Note this is /actuator/prometheus, not Quarkus's /q/metrics.
management.endpoints.web.exposure.include=health,info,prometheus

# Multi-tenancy (tenant name -> API key; the default/public tenant needs no key)
notes.tenant.tenant_a=key-a
notes.tenant.tenant_b=key-b

# Schema-per-tenant multi-tenancy. The resolver and connection provider beans are registered by
# HibernateTenancyConfiguration; see RequestTenantResolver and
# SchemaMultiTenantConnectionProvider.
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Hibernate Search index location. Set here rather than left to the default because the
# default writes to a fixed ./<EntityName> directory in the process working directory, whose
# Lucene lock is then contended by every @SpringBootTest context in the same JVM. Task 6
# configures the rest of the Hibernate Search backend.
spring.jpa.properties.hibernate.search.backend.directory.root=${notes.search.index-path:build/lucene-indexes}

# Pinned deliberately. Elide's controllers return Callable, so request handling is dispatched
# to an async worker thread; see TenantAsyncConfiguration for how the tenant is propagated there.
# NO LONGER LOAD-BEARING FOR TENANCY: before TenantAsyncConfiguration existed, isolation worked
# only because open-in-view opened the Hibernate Session (with its tenant identifier already
# bound) on the servlet thread, and flipping this to false routed every tenant to `public`
# silently. TenantAsyncConfiguration now propagates the tenant to the worker thread directly, and
# OpenInViewDisabledIsolationTest proves isolation holds with open-in-view=false. The value is
# kept only to pin the request-scoped EntityManager behaviour the app was built and tested
# against; it may be flipped on its own merits without affecting tenant isolation.
spring.jpa.open-in-view=true

# Hibernate Search (elide-datastore-search): local Lucene index, partitioned per tenant so
# full-text search results never cross the schema-multitenancy boundary. Without tenant_ids,
# ORM multi-tenancy being enabled (hibernate.multiTenancy=SCHEMA above) combined with an
# unpartitioned index means Lucene queries are not scoped to a tenant at all: a full-text
# search could return another tenant's notes even though every SQL-backed read stays correctly
# scoped by schema. See SearchTest#searchLeaksNothingAcrossTenants for the regression test.
# tenant_ids must list every tenant from notes.tenant.* above, plus the default "public"
# tenant (see TenantInfo#getDefaultTenant()) - keep the two lists in sync when adding a tenant.
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
spring.jpa.properties.hibernate.search.multi_tenancy.tenant_ids=public,tenant_a,tenant_b

# Analytics: HJSON-defined aggregation tables under src/main/resources/analytics.
# Autoconfigured by elide-spring-boot-starter - the Quarkus app had to build this store by hand.
# Path is bare ("/analytics"), NOT "classpath:/analytics": elide-model-config's FileLoader always
# prepends its own literal "classpath*:" prefix (confirmed by decompiling FileLoader with javap -
# its constructor builds the resource pattern as "classpath*:" + path + "**/*.hjson"), so a
# "classpath:" prefix here doubles up into the non-existent pattern "classpath*:classpath:/analytics/"
# and every table config silently fails to resolve, then falls back to (and fails) a plain
# filesystem File(path) lookup with "config path does not exist".
elide.aggregation-store.enabled=true
elide.aggregation-store.dynamic-config.enabled=true
elide.aggregation-store.dynamic-config.path=/analytics
# Default is "Hive" (AggregationStoreProperties.defaultDialect, confirmed by decompiling the
# class), which generates SQL this app's H2 database cannot execute correctly, so noteStats
# always returned zero rows until this was set explicitly.
elide.aggregation-store.default-dialect=h2
# The query cache (AggregationStoreProperties.QueryCache, enabled=true by default per javap)
# caches by generated SQL text only - it is NOT tenant-scoped, so with it on, whichever tenant's
# request reaches a given noteStats query first silently serves every other tenant the exact same
# cached rows. Since TenantAwareDataSource's entire purpose is per-request schema scoping, an
# unscoped cache defeats it outright; confirmed by two tests in the same JVM (one tenant-scoped,
# one not) racing on identical cached SQL until this was disabled.
elide.aggregation-store.query-cache.enabled=false

# Hibernate second-level cache, backed by Infinispan through the JCache (JSR-107) bridge. Caches
# entities by id, so a repeat read of /api/v1/notes/{id} is served from memory instead of the
# database. See infinispan.xml for the cache topology and TenantAwareJCacheRegionFactory for how
# regions are split per tenant.
#
# Infinispan's own Hibernate provider is deliberately NOT used: its newest build
# (infinispan-hibernate-cache-v66) targets Hibernate ORM 6.6, while this project is on 7.4, and no
# v7 build exists. The JCache bridge couples through the JSR-107 standard instead of Hibernate's
# internal cache SPI, so that version gap does not apply. See gradle/libs.versions.toml.
#
# Switched on and pointed at a provider by HibernateTenancyConfiguration rather than here. Three
# settings have to agree - whether caching is on, which JCache provider class backs it, and which
# config resource that provider reads - and all three follow notes.cache.mode below, so setting
# them statically would let them drift out of step. The region factory is likewise registered
# there as a constructed instance, because it needs TenantInfo injected and a class named in
# hibernate.cache.region.factory_class is instantiated by Hibernate's StrategySelector through its
# no-arg constructor, outside the Spring container.
#
# Where Infinispan runs. EMBEDDED (default) keeps it in this JVM: no infrastructure, no marshalling
# contract on entities, but cache memory competes with the application's and is cold after a
# restart. REMOTE reaches an Infinispan server over Hot Rod: memory isolated from app heap and
# surviving restarts, at the cost of a network hop per read, a server to run, and Protostream
# marshalling on every cached entity. Tenant scoping is identical in both - see
# TenantAwareJCacheRegionFactory, which works against the JCache CacheManager abstraction.
#
# Switch modes with the "remote" profile (application-remote.properties) rather than by editing
# this line: SPRING_PROFILES_ACTIVE=remote, or --spring.profiles.active=remote.
notes.cache.enabled=true
notes.cache.mode=embedded
# notes.cache.config-uri=  # defaults to infinispan.xml (embedded) / hotrod-client.properties (remote)
#
# LOAD-BEARING, and the same bug class as elide.aggregation-store.query-cache.enabled above.
# Hibernate's QueryKey is built from the SQL string, bound parameters, pagination and enabled
# filter names - it carries NO tenant identifier. Under schema-per-tenant the tenant lives on the
# JDBC connection, never in the SQL text, so every tenant's "select ... from note" produces a
# byte-identical key and whichever tenant queried first would serve its rows to all the others.
# The ENTITY cache does not have this problem: its keys are built by
# DefaultCacheKeysFactory#createEntityKey, which is handed the current tenant and folds it into
# the key - which is why second-level caching above is safe while this stays off.
#
# Turning this on would additionally require an EntityManager proxy: Elide 7.2.0 never calls
# setCacheable or sets the org.hibernate.cacheable hint on any query (verified by scanning every
# Elide jar), so with a stock Elide store the query cache is inert regardless of this setting.
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Query-source logging. One INFO line per API request saying which tier served it - the Infinispan
# second-level cache, the Lucene index, or the database - plus the underlying counts:
#
#   GET /api/v1/notes/<id> tenant=tenant_a status=200 servedBy=cache \
#       cacheHits=1 cacheMisses=0 indexQueries=0 dbLoads=0
#
# servedBy names the tier that DECIDED the result, which is not the same as the only tier touched.
# An index-served read still issues SQL (Lucene picks the ids, Hibernate fetches those rows by
# primary key), so it reports servedBy=index with dbLoads>0 - ranking the database first there
# would label every full-text query "database" and hide the index in the logs meant to reveal it.
#
# This is not a substitute for spring.jpa.show-sql above, and not a duplicate of it: show-sql
# prints statement text with no tenant, no request and no correlation to the cache lookups that
# preceded it. Set this to DEBUG for per-request detail, or TRACE on the region factory below for
# individual cache hits and misses.
logging.level.com.empyrean.elide.observability=INFO
# Per-lookup L2 cache tracing - one line per cache get, with region and tenant. Verbose by design;
# uncomment only when diagnosing why a specific entity is not being cached. Note the name is the
# region factory itself, not its inner TenantAwareStorageAccess: Spring reads "$" in a properties
# key as a placeholder delimiter, so a logger name containing one never binds and the level is
# silently ignored.
# logging.level.com.empyrean.elide.config.TenantAwareJCacheRegionFactory=TRACE

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI needs no configuration: springdoc scans @RestController classes, Elide contributes its
# generated entity paths, and both use the same io.swagger.v3 object model - so adding a
# controller requires no documentation code. springdoc's defaults (/v3/api-docs,
# /swagger-ui.html) are what the vendored Swagger UI points at.
#
# Silences a benign ERROR logged while the docs are generated:
#
#   ERROR i.s.v3.core.util.ReferenceTypeUtils : Error unwrapping optional
#   java.lang.IllegalArgumentException: Unrecognized Type: TableType{ name=noteStats }
#
# swagger-core reflects over Java types, but Elide builds analytics tables as dynamic TableType
# instances from the HJSON under src/main/resources/analytics - there is no Java class for
# noteStats to reflect over, so this type is genuinely unrecognizable to it. swagger-core logs the
# failure at ERROR and then carries on: /v3/api-docs returns 200, every other path is documented,
# and /api/v1/noteStats works normally (AnalyticsTest covers it). The only cost is that the
# analytics table has no generated schema, which no reflection-based tool can produce for a type
# that exists only as runtime metadata.
#
# Scoped to this one swagger-core class rather than a broader package so a real documentation
# failure elsewhere still surfaces. Raise it back to ERROR if analytics paths ever need debugging.
logging.level.io.swagger.v3.core.util.ReferenceTypeUtils=OFF
