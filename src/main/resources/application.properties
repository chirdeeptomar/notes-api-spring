spring.application.name=notes-api-spring

# 8081, not the default 8080. Tests are unaffected (they bind a random port).
server.port=8081

# Database (dev/test): H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

elide.json-api.enabled=true
elide.json-api.path=/api/v1
elide.graphql.enabled=true
elide.graphql.path=/graphql/api/v1
elide.api-docs.enabled=true
elide.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info,prometheus

# Multi-tenancy (tenant name -> API key; the default/public tenant needs no key).
svc.tenant.tenant_a=key-a
svc.tenant.tenant_b=key-b

# Schema-per-tenant multi-tenancy. See RequestTenantResolver / SchemaMultiTenantConnectionProvider.
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Avoids Lucene write.lock contention between @SpringBootTest contexts sharing the default
# ./<EntityName> directory.
spring.jpa.properties.hibernate.search.backend.directory.root=${svc.search.index-path:build/lucene-indexes}

# Kept true to pin the request-scoped EntityManager behavior this app was tested against. Tenant
# isolation itself does not depend on it - see TenantAsyncConfiguration and
# OpenInViewDisabledIsolationTest.
spring.jpa.open-in-view=true

# Hibernate Search backend. svc.search.mode / svc.search.enabled are not set here -
# SearchProperties already defaults to lucene/enabled=true; see application-opensearch.properties
# / application-elasticsearch.properties for the remote alternatives.
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
# Partitions the index per tenant so full-text results can't cross tenants. Must list every tenant
# from svc.tenant.* above, plus "public" - keep the two lists in sync.
spring.jpa.properties.hibernate.search.multi_tenancy.tenant_ids=public,tenant_a,tenant_b

# HJSON-defined aggregation tables under src/main/resources/analytics.
elide.aggregation-store.enabled=true
elide.aggregation-store.dynamic-config.enabled=true
elide.aggregation-store.dynamic-config.path=/analytics
# Default dialect (Hive) produces SQL H2 can't run.
elide.aggregation-store.default-dialect=h2
# LOAD-BEARING: this cache keys by SQL text only, with no tenant dimension - leaving it on lets one
# tenant's noteStats rows leak to another.
elide.aggregation-store.query-cache.enabled=false

# Hibernate second-level cache via Infinispan (JCache/JSR-107 bridge - see
# gradle/libs.versions.toml for why, not Infinispan's native Hibernate provider). See
# infinispan.xml for topology and TenantAwareJCacheRegionFactory for per-tenant regions.
#
# svc.cache.enabled / svc.cache.mode are not set here - CacheProperties already defaults to
# enabled=true, mode=EMBEDDED. Switch to remote with the "infinispan" profile
# (application-infinispan.properties): SPRING_PROFILES_ACTIVE=infinispan.
# svc.cache.config-uri=  # defaults to infinispan.xml (embedded) / infinispan/hotrod-client.properties (remote)

# LOAD-BEARING, same bug class as the aggregation query cache above: Hibernate's QueryKey carries
# no tenant identifier, so this would leak rows across tenants. The entity cache is unaffected -
# DefaultCacheKeysFactory#createEntityKey folds the tenant into its keys.
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Query-source logging: one INFO line per API request naming which tier served it (cache/index/db)
# and the underlying counts. See QuerySourceLoggingFilter. Not a substitute for show-sql above -
# that prints statement text with no tenant/request correlation.
logging.level.com.empyrean.elide.observability=INFO
# Per-lookup L2 cache tracing - verbose, uncomment only when diagnosing a specific entity.
# logging.level.com.empyrean.elide.config.TenantAwareJCacheRegionFactory=TRACE

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI needs no configuration: springdoc scans @RestController classes, Elide contributes its
# generated entity paths, and both share the same io.swagger.v3 object model.
#
# Silences a benign ERROR (swagger-core can't reflect over Elide's dynamic HJSON-defined
# TableType, e.g. noteStats - the docs still generate fine; see AnalyticsTest).
logging.level.io.swagger.v3.core.util.ReferenceTypeUtils=OFF
