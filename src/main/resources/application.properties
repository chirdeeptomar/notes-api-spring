spring.application.name=notes-api-spring

# Serve on 8081 rather than the default 8080. Tests are unaffected (they bind a random port).
server.port=8081

# Database (dev/test): H2 in PostgreSQL compatibility mode, matching the source project.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Elide endpoint paths - must match the Quarkus app exactly.
elide.json-api.enabled=true
elide.json-api.path=/api/v1
elide.graphql.enabled=true
elide.graphql.path=/graphql/api/v1
elide.api-docs.enabled=true
elide.api-docs.path=/api-docs

# Metrics. Note this is /actuator/prometheus, not Quarkus's /q/metrics.
management.endpoints.web.exposure.include=health,info,prometheus

# Multi-tenancy (tenant name -> API key; the default/public tenant needs no key)
notes.tenant.tenant_a=key-a
notes.tenant.tenant_b=key-b

# Schema-per-tenant multi-tenancy. The resolver and connection provider beans are registered by
# HibernateTenancyConfiguration; see RequestTenantResolver and
# SchemaMultiTenantConnectionProvider.
spring.jpa.properties.hibernate.multiTenancy=SCHEMA

# Hibernate Search index location. Set here rather than left to the default because the
# default writes to a fixed ./<EntityName> directory in the process working directory, whose
# Lucene lock is then contended by every @SpringBootTest context in the same JVM. Task 6
# configures the rest of the Hibernate Search backend.
spring.jpa.properties.hibernate.search.backend.directory.root=${notes.search.index-path:build/lucene-indexes}

# Pinned deliberately. Elide's controllers return Callable, so request handling is dispatched
# to an async worker thread; see TenantAsyncConfiguration for how the tenant is propagated there.
# NO LONGER LOAD-BEARING FOR TENANCY: before TenantAsyncConfiguration existed, isolation worked
# only because open-in-view opened the Hibernate Session (with its tenant identifier already
# bound) on the servlet thread, and flipping this to false routed every tenant to `public`
# silently. TenantAsyncConfiguration now propagates the tenant to the worker thread directly, and
# OpenInViewDisabledIsolationTest proves isolation holds with open-in-view=false. The value is
# kept only to pin the request-scoped EntityManager behaviour the app was built and tested
# against; it may be flipped on its own merits without affecting tenant isolation.
spring.jpa.open-in-view=true

# Hibernate Search (elide-datastore-search): local Lucene index, partitioned per tenant so
# full-text search results never cross the schema-multitenancy boundary. Without tenant_ids,
# ORM multi-tenancy being enabled (hibernate.multiTenancy=SCHEMA above) combined with an
# unpartitioned index means Lucene queries are not scoped to a tenant at all: a full-text
# search could return another tenant's notes even though every SQL-backed read stays correctly
# scoped by schema. See SearchTest#searchLeaksNothingAcrossTenants for the regression test.
# tenant_ids must list every tenant from notes.tenant.* above, plus the default "public"
# tenant (see TenantInfo#getDefaultTenant()) - keep the two lists in sync when adding a tenant.
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
spring.jpa.properties.hibernate.search.multi_tenancy.tenant_ids=public,tenant_a,tenant_b

# Analytics: HJSON-defined aggregation tables under src/main/resources/analytics.
# Autoconfigured by elide-spring-boot-starter - the Quarkus app had to build this store by hand.
# Path is bare ("/analytics"), NOT "classpath:/analytics": elide-model-config's FileLoader always
# prepends its own literal "classpath*:" prefix (confirmed by decompiling FileLoader with javap -
# its constructor builds the resource pattern as "classpath*:" + path + "**/*.hjson"), so a
# "classpath:" prefix here doubles up into the non-existent pattern "classpath*:classpath:/analytics/"
# and every table config silently fails to resolve, then falls back to (and fails) a plain
# filesystem File(path) lookup with "config path does not exist".
elide.aggregation-store.enabled=true
elide.aggregation-store.dynamic-config.enabled=true
elide.aggregation-store.dynamic-config.path=/analytics
# Default is "Hive" (AggregationStoreProperties.defaultDialect, confirmed by decompiling the
# class), which generates SQL this app's H2 database cannot execute correctly, so noteStats
# always returned zero rows until this was set explicitly.
elide.aggregation-store.default-dialect=h2
# The query cache (AggregationStoreProperties.QueryCache, enabled=true by default per javap)
# caches by generated SQL text only - it is NOT tenant-scoped, so with it on, whichever tenant's
# request reaches a given noteStats query first silently serves every other tenant the exact same
# cached rows. Since TenantAwareDataSource's entire purpose is per-request schema scoping, an
# unscoped cache defeats it outright; confirmed by two tests in the same JVM (one tenant-scoped,
# one not) racing on identical cached SQL until this was disabled.
elide.aggregation-store.query-cache.enabled=false

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI needs no configuration: springdoc scans @RestController classes, Elide contributes its
# generated entity paths, and both use the same io.swagger.v3 object model - so adding a
# controller requires no documentation code. springdoc's defaults (/v3/api-docs,
# /swagger-ui.html) are what the vendored Swagger UI points at.
