spring.application.name=notes-api-spring

# 8081, not the default 8080. Tests are unaffected (they bind a random port).
server.port=8081

# Database (dev/test): H2 in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:notes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

elide.json-api.enabled=true
elide.json-api.path=/api/v1
elide.graphql.enabled=true
elide.graphql.path=/graphql/api/v1
elide.api-docs.enabled=true
elide.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info,prometheus

# Multi-tenancy is OFF by default (TenancyProperties.enabled defaults to false) - a deployment
# that never sets svc.tenancy.enabled gets a single-tenant application. This app's own default
# profile opts in explicitly, since the sample demonstrates the multi-tenant path; a real
# single-tenant deployment would simply omit this line and svc.tenant.* below entirely.
svc.tenancy.enabled=true

# Multi-tenancy (tenant ids and API keys, paired by index - ids[0]/keys[0] is one tenant, etc).
# Only meaningful when svc.tenancy.enabled=true, above. Every request must then present a
# matching X-API-KEY; there is no default/public tenant reachable without one - see
# TenantHeaderFilter.
svc.tenant.ids=tenant_a,tenant_b
svc.tenant.keys=key-a,key-b

# There is no separate "multiTenancy=SCHEMA" property to set: Hibernate 7 has no such enum-typed
# setting any more (confirmed by decompiling hibernate-core) - it enables its multi-tenancy SPI
# purely by whether a MultiTenantConnectionProvider service was registered, which
# HibernateTenancyConfiguration.tenantResolverCustomizer does conditionally on svc.tenancy.enabled.
# See RequestTenantResolver / SchemaMultiTenantConnectionProvider / TenancyProperties.

# Avoids Lucene write.lock contention between @SpringBootTest contexts sharing the default
# ./<EntityName> directory.
svc.search.index-path=${SEARCH_INDEX_PATH:build/lucene-indexes}

# Kept true to pin the request-scoped EntityManager behavior this app was tested against. Tenant
# isolation itself does not depend on it - see TenantAsyncConfiguration and
# OpenInViewDisabledIsolationTest.
spring.jpa.open-in-view=true

# Full-text search is OFF by default (SearchProperties.enabled defaults to false) - a deployment
# that never sets svc.search.enabled needs no Lucene/Elasticsearch infrastructure at all. This
# app's own default profile opts in explicitly, since the sample demonstrates the search path; a
# deployment with search off would simply omit this line (Note then falls back to the plain JPA
# store - infix/prefix filters still work, just via a SQL LIKE instead of the index).
svc.search.enabled=true

# Every hibernate.search.backend.* property is set programmatically from SearchProperties by
# HibernateTenancyConfiguration.searchBackendCustomizer, branching on svc.search.mode (defaults
# to lucene - no need to set it here). A single SVC_SEARCH_MODE=opensearch/elasticsearch switches
# the backend type, host, credentials and version together - the same "one property switches
# several dependent settings" shape svc.cache.mode already has. See application-opensearch.properties
# / application-elasticsearch.properties for the remote connection-detail env var defaults.
spring.jpa.properties.hibernate.search.schema_management.strategy=create-or-update
# Partitions the index per tenant so full-text results can't cross tenants - but only when
# svc.tenancy.enabled=true. Set programmatically from TenantInfo, not statically here: see
# HibernateTenancyConfiguration.searchTenantIdsCustomizer. When tenancy is disabled, this
# property must NOT be set at all (Hibernate Search's own multi-tenancy strategy then expects
# no tenant identifiers, and providing any fails every index operation).

# HJSON-defined aggregation tables under src/main/resources/analytics.
elide.aggregation-store.enabled=true
elide.aggregation-store.dynamic-config.enabled=true
elide.aggregation-store.dynamic-config.path=/analytics
# Default dialect (Hive) produces SQL H2 can't run.
elide.aggregation-store.default-dialect=h2
# LOAD-BEARING: this cache keys by SQL text only, with no tenant dimension - leaving it on lets one
# tenant's noteStats rows leak to another.
elide.aggregation-store.query-cache.enabled=false

# Hibernate second-level cache via Infinispan (JCache/JSR-107 bridge - see
# gradle/libs.versions.toml for why, not Infinispan's native Hibernate provider). See
# infinispan.xml for topology and TenantAwareJCacheRegionFactory for per-tenant regions.
#
# The second-level cache is OFF by default (CacheProperties.enabled defaults to false) - a
# deployment that never sets svc.cache.enabled needs no Infinispan infrastructure at all. This
# app's own default profile opts in explicitly, since the sample demonstrates the caching path; a
# deployment with caching off would simply omit this line (every read then goes to the database).
svc.cache.enabled=true
# svc.cache.mode is not set here - CacheProperties already defaults to mode=EMBEDDED. Switch to
# remote with the "infinispan" profile (application-infinispan.properties):
# SPRING_PROFILES_ACTIVE=infinispan.
# svc.cache.config-uri=  # defaults to infinispan.xml (embedded) / infinispan/hotrod-client.properties (remote)

# LOAD-BEARING, same bug class as the aggregation query cache above: Hibernate's QueryKey carries
# no tenant identifier, so this would leak rows across tenants. The entity cache is unaffected -
# DefaultCacheKeysFactory#createEntityKey folds the tenant into its keys.
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Query-source logging: one INFO line per API request naming which tier served it (cache/index/db)
# and the underlying counts. See QuerySourceLoggingFilter. Not a substitute for show-sql above -
# that prints statement text with no tenant/request correlation.
logging.level.com.empyrean.elide.observability=INFO
# Per-lookup L2 cache tracing - verbose, uncomment only when diagnosing a specific entity.
# logging.level.com.empyrean.elide.config.TenantAwareJCacheRegionFactory=TRACE

# Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI needs no configuration: springdoc scans @RestController classes, Elide contributes its
# generated entity paths, and both share the same io.swagger.v3 object model.
#
# Silences a benign ERROR (swagger-core can't reflect over Elide's dynamic HJSON-defined
# TableType, e.g. noteStats - the docs still generate fine; see AnalyticsTest).
logging.level.io.swagger.v3.core.util.ReferenceTypeUtils=OFF
