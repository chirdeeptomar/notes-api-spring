# Runs full-text search against a remote Elasticsearch cluster instead of the embedded Lucene
# default. Activate with SPRING_PROFILES_ACTIVE=elasticsearch (or
# --spring.profiles.active=elasticsearch); combines with other profiles, e.g.
# SPRING_PROFILES_ACTIVE=dev,elasticsearch.
#
# The switch itself is svc.search.mode=elasticsearch, not a property in this file - see
# application-opensearch.properties for why (same customizer, same "one property switches
# several dependent settings" shape as svc.cache.mode). This file exists only to give the remote
# connection details their env-var-backed defaults - it can be omitted entirely in favor of
# passing svc.search.* properties directly.
#
# See application-opensearch.properties for why this is the same backend.type as OpenSearch (one
# artifact, hibernate-search-backend-elasticsearch, serves both) - only backend.version differs,
# using a bare Elasticsearch version string here instead of an "opensearch:"-prefixed one.
#
# Tenant scoping is unchanged by this profile: hibernate.search.multi_tenancy.tenant_ids (set
# programmatically - see HibernateTenancyConfiguration.searchTenantIdsCustomizer) is honored
# identically, but realized as one real Elasticsearch index per tenant rather than one local
# Lucene directory per tenant - each tenant costs cluster shards and replicas here, not a free
# filesystem directory, worth planning for as tenants are added.
#
# SEARCH_VERSION_CHECK=false is the escape hatch for a managed Elasticsearch service that reports
# a version string outside Hibernate Search's officially tested range - it disables Hibernate
# Search's startup validation of the live cluster's reported version against SEARCH_VERSION.
svc.search.mode=elasticsearch
svc.search.hosts=${SEARCH_HOSTS:localhost:9200}
svc.search.protocol=${SEARCH_PROTOCOL:http}
svc.search.username=${SEARCH_USER:}
svc.search.password=${SEARCH_PASSWORD:}
svc.search.version=${SEARCH_VERSION:9}
svc.search.version-check-enabled=${SEARCH_VERSION_CHECK:true}
