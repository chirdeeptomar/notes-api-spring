# Runs full-text search against a remote Elasticsearch cluster instead of the embedded Lucene
# default. Activate with SPRING_PROFILES_ACTIVE=elasticsearch (or
# --spring.profiles.active=elasticsearch); combines with other profiles, e.g.
# SPRING_PROFILES_ACTIVE=dev,elasticsearch.
#
# See application-opensearch.properties for why this is the same backend.type as OpenSearch (one
# artifact, hibernate-search-backend-elasticsearch, serves both) - only backend.version differs,
# using a bare Elasticsearch version string here instead of an "opensearch:"-prefixed one.
#
# Tenant scoping is unchanged by this profile: hibernate.search.multi_tenancy.tenant_ids (in
# application.properties) is honored identically, but realized as one real Elasticsearch index
# per tenant rather than one local Lucene directory per tenant - each tenant costs cluster shards
# and replicas here, not a free filesystem directory, worth planning for as tenants are added.
#
# SEARCH_VERSION_CHECK=false is the escape hatch for a managed Elasticsearch service that reports
# a version string outside Hibernate Search's officially tested range - it disables Hibernate
# Search's startup validation of the live cluster's reported version against SEARCH_VERSION.
svc.search.mode=elasticsearch
spring.jpa.properties.hibernate.search.backend.type=elasticsearch
spring.jpa.properties.hibernate.search.backend.hosts=${SEARCH_HOSTS:localhost:9200}
spring.jpa.properties.hibernate.search.backend.protocol=${SEARCH_PROTOCOL:http}
spring.jpa.properties.hibernate.search.backend.username=${SEARCH_USER:}
spring.jpa.properties.hibernate.search.backend.password=${SEARCH_PASSWORD:}
spring.jpa.properties.hibernate.search.backend.version=${SEARCH_VERSION:9.x}
spring.jpa.properties.hibernate.search.backend.version_check.enabled=${SEARCH_VERSION_CHECK:true}
