# Runs full-text search against a remote OpenSearch cluster instead of the embedded Lucene
# default. Activate with SPRING_PROFILES_ACTIVE=opensearch (or --spring.profiles.active=opensearch);
# combines with other profiles, e.g. SPRING_PROFILES_ACTIVE=dev,opensearch.
#
# Both OpenSearch and Elasticsearch are served by the same hibernate-search-backend-elasticsearch
# artifact (backend.type=elasticsearch below is correct for OpenSearch too) - Hibernate Search
# tells them apart purely via backend.version's "opensearch:" prefix, since OpenSearch's version
# numbers diverged from Elasticsearch's after the 2021 fork.
#
# Tenant scoping is unchanged by this profile: hibernate.search.multi_tenancy.tenant_ids (in
# application.properties) is honored identically, but realized as one real OpenSearch index per
# tenant rather than one local Lucene directory per tenant - each tenant costs cluster shards and
# replicas here, not a free filesystem directory, worth planning for as tenants are added.
#
# SEARCH_VERSION_CHECK=false is the escape hatch for a managed OpenSearch service that reports a
# version string outside the officially tested 1.3/2.x/3.x range - it disables Hibernate Search's
# startup validation of the live cluster's reported version against SEARCH_VERSION.
svc.search.mode=opensearch
spring.jpa.properties.hibernate.search.backend.type=elasticsearch
spring.jpa.properties.hibernate.search.backend.hosts=${SEARCH_HOSTS:localhost:9200}
spring.jpa.properties.hibernate.search.backend.protocol=${SEARCH_PROTOCOL:http}
spring.jpa.properties.hibernate.search.backend.username=${SEARCH_USER:}
spring.jpa.properties.hibernate.search.backend.password=${SEARCH_PASSWORD:}
spring.jpa.properties.hibernate.search.backend.version=opensearch:${SEARCH_VERSION:2.x}
spring.jpa.properties.hibernate.search.backend.version_check.enabled=${SEARCH_VERSION_CHECK:true}
