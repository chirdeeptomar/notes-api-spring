# Runs full-text search against a remote OpenSearch cluster instead of the embedded Lucene
# default. Activate with SPRING_PROFILES_ACTIVE=opensearch (or --spring.profiles.active=opensearch);
# combines with other profiles, e.g. SPRING_PROFILES_ACTIVE=dev,opensearch.
#
# The switch itself is svc.search.mode=opensearch, not a property in this file -
# HibernateTenancyConfiguration.searchBackendCustomizer sets every hibernate.search.backend.*
# property from SearchProperties, the same "one property switches several dependent settings"
# shape svc.cache.mode already has for caching. This file exists only to give the remote
# connection details their env-var-backed defaults - it can be omitted entirely in favor of
# passing svc.search.* properties directly.
#
# Both OpenSearch and Elasticsearch are served by the same hibernate-search-backend-elasticsearch
# artifact - Hibernate Search tells them apart purely via backend.version's "opensearch:" prefix,
# which SearchProperties#resolvedBackendVersion() adds automatically for this mode.
#
# Tenant scoping is unchanged by this profile: hibernate.search.multi_tenancy.tenant_ids (set
# programmatically - see HibernateTenancyConfiguration.searchTenantIdsCustomizer) is honored
# identically, but realized as one real OpenSearch index per tenant rather than one local Lucene
# directory per tenant - each tenant costs cluster shards and replicas here, not a free
# filesystem directory, worth planning for as tenants are added.
#
# SEARCH_VERSION_CHECK=false is the escape hatch for a managed OpenSearch service that reports a
# version string outside the officially tested 1.3/2.x/3.x range - it disables Hibernate Search's
# startup validation of the live cluster's reported version against SEARCH_VERSION.
svc.search.mode=opensearch
svc.search.hosts=${SEARCH_HOSTS:localhost:9200}
svc.search.protocol=${SEARCH_PROTOCOL:http}
svc.search.username=${SEARCH_USER:}
svc.search.password=${SEARCH_PASSWORD:}
svc.search.version=${SEARCH_VERSION:3.6.0}
svc.search.version-check-enabled=${SEARCH_VERSION_CHECK:true}
