# Hot Rod client configuration, read only when notes.cache.mode=remote.
#
# Unused in the default (embedded) mode - it is shipped so switching modes is a config change
# rather than a code change. Point it at a running Infinispan server; everything else about the
# cache behaves identically, because TenantAwareJCacheRegionFactory works against the JCache
# CacheManager abstraction and never against Infinispan directly.
#
# WHAT REMOTE MODE NEEDS that embedded does not:
#
#   1. A marshaller that can handle Hibernate's cache types - configured below. Note that it is
#      NOT the entity that crosses the wire: the key is Hibernate's CacheKeyImplementation and the
#      value is a cache entry holding disassembled field values, so annotating Note with
#      Protostream would not be sufficient. See the marshaller section at the bottom.
#
#   2. The caches must exist on the server, one per (entity, tenant), matching the names
#      TenantAwareJCacheRegionFactory asks for:
#          com.empyrean.elide.model.Note.public
#          com.empyrean.elide.model.Note.tenant_a
#          com.empyrean.elide.model.Note.tenant_b
#      plus default-update-timestamps-region and default-query-results-region. Create them with
#      the same topology intent as infinispan.xml: bounded, evicting caches for the entity
#      regions, and a non-evicting one for the timestamps region. (A server running with
#      on-demand cache creation will make them itself, which is why local development works
#      without creating them by hand.)
#
# Verified working against Infinispan Server 16.2.3 with SCRAM-SHA-512 against the default
# properties realm.

# NOTE the "env." prefix. This file is read by the Hot Rod client, NOT by Spring, so Spring's
# ${VAR:default} placeholder syntax does not apply here. Infinispan's own StringPropertyReplacer
# resolves ${p} against SYSTEM PROPERTIES and requires an explicit "env." prefix for environment
# variables (${env.VAR}), with ${env.VAR:default} supplying a fallback. Written as plain ${VAR},
# the reference silently resolves to the literal default instead - which is how an empty password
# reached the server and surfaced as "ISPN006024: Invalid credentials".
#
# ISPN_USER defaults to "admin" (the Infinispan server's conventional first user) so local
# development needs only ISPN_PASSWORD. ISPN_PASSWORD deliberately has NO default: a blank
# password reaches the server as "ISPN006024: Invalid credentials", which reads like a wrong
# password rather than a missing environment variable and is slow to diagnose. Leaving the
# placeholder unresolved makes the cause visible in the failure instead.
infinispan.client.hotrod.server_list=${env.ISPN_HOSTS:localhost:11222}
infinispan.client.hotrod.auth_username=${env.ISPN_USER:admin}
infinispan.client.hotrod.auth_password=${env.ISPN_PASSWORD}
infinispan.client.hotrod.auth_realm=default
infinispan.client.hotrod.sasl_mechanism=SCRAM-SHA-512

# Fail fast rather than hanging a request thread when the cache tier is unreachable: a cache is a
# latency optimisation, and blocking on it converts a cache outage into an application outage.
infinispan.client.hotrod.connect_timeout=2000
infinispan.client.hotrod.socket_timeout=2000

# Per-cache server-side configuration, applied when the client first asks for each cache.
#
# WITHOUT THIS the server still creates the caches on demand, but from its own empty default:
# an unbounded local-cache with no eviction, no expiration and no statistics. That looks like it
# works - entries are stored and served correctly - while quietly removing the memory bound that
# infinispan.xml applies in embedded mode, which is exactly the property that matters at volume.
# It also leaves the admin console showing no statistics for these caches.
#
# infinispan.xml does NOT apply in remote mode: it configures an embedded cache container, and the
# server is a separate process with its own configuration. The topology below therefore mirrors it
# by hand - bounded, evicting entity regions, and a non-evicting timestamps region.
#
# In a managed deployment, prefer creating these caches on the server (or via a template) and
# dropping these lines; they exist so a developer pointing at a fresh server gets the intended
# topology rather than silently unbounded caches.
# NOTE THE SQUARE BRACKETS. These cache names contain dots, and the client parses an unbracketed
# key by cutting at the first dot after the prefix (ConfigurationBuilder: k.indexOf('.', ...)), so
# "cache.com.empyrean.elide.model.Note.tenant_a.configuration" is read as a cache named
# "com.empyrean" and then silently ignored. The bracket form is what makes a dotted name parse.
infinispan.client.hotrod.cache.[com.empyrean.elide.model.Note.public].configuration=<local-cache statistics="true"><memory max-count="10000"/><expiration max-idle="1800000" interval="60000"/></local-cache>
infinispan.client.hotrod.cache.[com.empyrean.elide.model.Note.tenant_a].configuration=<local-cache statistics="true"><memory max-count="10000"/><expiration max-idle="1800000" interval="60000"/></local-cache>
infinispan.client.hotrod.cache.[com.empyrean.elide.model.Note.tenant_b].configuration=<local-cache statistics="true"><memory max-count="10000"/><expiration max-idle="1800000" interval="60000"/></local-cache>
# Timestamps region: never bounded or expiring. Hibernate uses it to decide whether cached data is
# still fresh, so losing an entry makes it treat valid cached data as stale.
infinispan.client.hotrod.cache.[default-update-timestamps-region].configuration=<local-cache statistics="true"/>

# Marshalling. Remote mode serializes every entry, and the types crossing the wire are Hibernate's
# internal cache classes - not this application's entities. The cache KEY is
# org.hibernate.cache.internal.CacheKeyImplementation (which is what carries the tenant identifier)
# and the VALUE is a Hibernate cache entry holding the entity's disassembled field values, so a
# Protostream schema on Note alone would not be enough; the default Protostream marshaller rejects
# these with "No marshaller registered for object of Java type ...CacheKeyImplementation".
#
# Java serialization handles them directly: the Hibernate cache types are all Serializable. The
# allowlist is required and is a security control - it bounds what this client will deserialize
# from the cache server, so keep it to the Hibernate cache packages and the JDK types the entity's
# own fields use, and never widen it to ".*".
infinispan.client.hotrod.marshaller=org.infinispan.commons.marshall.JavaSerializationMarshaller
#
# java.sql.* is required even though no entity declares a java.sql type: Hibernate disassembles
# temporal fields to their JDBC representation, so Note.createdDate (a java.util.Date) is cached
# as a java.sql.Timestamp. Omitting it fails only on the cache READ, as
# "ISPN000936: Class 'java.sql.Timestamp' blocked by deserialization allow list" - writes succeed,
# so the gap surfaces as a 500 on the second request rather than at startup. Expect the same for
# java.math.BigDecimal on monetary fields when financial entities are added.
infinispan.client.hotrod.java_serial_allowlist=org.hibernate.cache.*,org.hibernate.type.*,java.util.*,java.lang.*,java.time.*,java.math.*,java.sql.*,com.empyrean.elide.model.*
