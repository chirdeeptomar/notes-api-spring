# Gradle version catalog. Referenced from build.gradle.kts as libs.<alias>.
#
# Only versions NOT managed by a BOM belong here. The Spring Boot plugin's BOM manages the
# spring-boot-*, micrometer and h2/postgresql versions, so those aliases carry no version on
# purpose - pinning them by hand is what reintroduces conflicts.

[versions]
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
lombokPlugin = "8.10"

# Elide and its satellite artifacts all move together; keep them on one version.
elide = "7.2.0"

datafaker = "2.7.0"

# springdoc 3.x is the Spring Boot 4 line (springdoc-openapi 3.1.1's parent is
# spring-boot-starter-parent 4.1.0); springdoc 2.x targets Spring Boot 3.x. A 2.x version still
# RESOLVES under Spring Boot 4 but integrates against Spring Boot 3 APIs. Do not downgrade while
# this project is on Spring Boot 4.
springdoc = "3.1.1"

restAssured = "5.5.2"

# Spring Boot 4.1's BOM imports the Groovy 5 platform, which upgrades rest-assured's declared
# Groovy 4 dependency and breaks it at runtime - see the dependencyManagement block in
# build.gradle.kts.
groovy = "4.0.22"

# Infinispan supplies the JSR-107 (JCache) provider backing Hibernate's second-level cache.
# NOT managed by any BOM here, so pinned explicitly.
#
# Deliberately NOT using Infinispan's native Hibernate provider: the newest one published is
# infinispan-hibernate-cache-v66, which targets Hibernate ORM 6.6, while this project resolves
# hibernate-core 7.4.x through the Spring Boot BOM. No v7 provider exists. The supported route
# is therefore the JCache bridge (hibernate-jcache + infinispan-jcache), which couples through
# the JSR-107 standard instead of Hibernate's internal cache SPI and so is unaffected by that
# version gap. Both sides agree on javax.cache:cache-api 1.1.1, and infinispan-jcache declares
# it "provided" so Hibernate's copy is the one on the classpath.
infinispan = "16.1.4"

# elide-datastore-search pulls hibernate-search-mapper-orm and hibernate-search-backend-lucene
# in transitively at this version (from Elide's own parent POM), but declares no version property
# of its own to reference - pinned here explicitly because the Elasticsearch backend below is a
# sibling artifact that must match it exactly.
hibernateSearch = "8.4.0.Final"

[libraries]
# Brings in spring-boot-starter-web and spring-boot-starter-data-jpa transitively.
elide-spring-boot-starter = { module = "com.yahoo.elide:elide-spring-boot-starter", version.ref = "elide" }
# Brings in hibernate-search-mapper-orm and hibernate-search-backend-lucene transitively.
elide-datastore-search = { module = "com.yahoo.elide:elide-datastore-search", version.ref = "elide" }
elide-test-helpers = { module = "com.yahoo.elide:elide-test-helpers", version.ref = "elide" }

# notes.search.mode=opensearch|elasticsearch. Same artifact serves both: Hibernate Search tells
# them apart purely via the hibernate.search.backend.version property (an "opensearch:" prefix vs
# a bare version string), since OpenSearch's own version numbers diverged from Elasticsearch's
# after the 2021 fork. Shipped alongside the Lucene backend so the mode is a config switch rather
# than a rebuild.
hibernate-search-backend-elasticsearch = { module = "org.hibernate.search:hibernate-search-backend-elasticsearch", version.ref = "hibernateSearch" }

# Version-less: managed by the Spring Boot BOM.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
h2 = { module = "com.h2database:h2" }
postgresql = { module = "org.postgresql:postgresql" }

springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }

# Second-level cache. hibernate-jcache is version-less (Spring Boot BOM manages the whole
# hibernate-* line, so pinning it here would be the exact conflict this file warns about);
# the Infinispan artifacts are not BOM-managed and use the pin above.
hibernate-jcache = { module = "org.hibernate.orm:hibernate-jcache" }
# Embedded mode (notes.cache.mode=embedded, the default).
infinispan-jcache = { module = "org.infinispan:infinispan-jcache", version.ref = "infinispan" }
infinispan-core = { module = "org.infinispan:infinispan-core", version.ref = "infinispan" }
# Remote mode (notes.cache.mode=remote). Both sets are shipped so the mode is a config switch
# rather than a rebuild; each jar registers its own javax.cache.spi.CachingProvider via
# ServiceLoader, which is why CacheProperties.Mode names the provider class explicitly instead of
# letting Caching.getCachingProvider() pick between the two.
infinispan-jcache-remote = { module = "org.infinispan:infinispan-jcache-remote", version.ref = "infinispan" }
infinispan-client-hotrod = { module = "org.infinispan:infinispan-client-hotrod", version.ref = "infinispan" }

# No [libraries] entries for Groovy: it is never declared as a dependency, only version-pinned
# through dependencyManagement, which reads libs.versions.groovy directly.

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
lombok = { id = "io.freefair.lombok", version.ref = "lombokPlugin" }
